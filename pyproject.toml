[project]
name = "scrape-luma"
version = "0.1.0"
description = "Scrape Luma event guest lists and X/Twitter bios to Google Sheets"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "playwright>=1.49",
    "gspread>=6",
    "google-auth>=2",
    "pydantic>=2",
    "google-api-python-client>=2.190.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "python-multipart>=0.0.20",
]

[project.scripts]
scrape-luma = "scrape_luma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrape_luma"]

[tool.hatch.build.targets.editable]
packages = ["src/scrape_luma"]
